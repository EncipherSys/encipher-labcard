name: validate

on:
  push:
  pull_request:

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cards
        run: python3 tools/validate_card.py
      - name: Run CPU oracle
        run: python3 tools/run_oracle.py
      - name: Hash sample bundle
        run: python3 tools/hashbundle.py examples/sample-bundle/bundle.json
